; Scalability per device class. sg.* groups go from 0 (low) to 3 (epic); the explicit cvars after them win.
; Mobile has no separate r.Mobile.* switches for depth of field or bloom: the renderer drops depth of field when
; r.DepthOfFieldQuality is 0 and bloom when r.BloomQuality is 0 (likewise lens flares and chromatic aberration
; with r.LensFlareQuality and r.SceneColorFringeQuality), so those are the per-device toggles.
; r.Tonemapper.Quality: 2 keeps filmic contrast and vignette, 4 adds film grain, 5 is full quality.
; r.MobileContentScaleFactor on Android is relative to 720p (1.0 = 720x1280 portrait, 1.5 = 1080x1920);
; on iOS it multiplies the screen size in points (2.0 = Retina). Temporal AA keeps lower factors clean.
; Shadows stay on even on low-end phones: the shaft of dawn light through the window is the game's key image.

[Android_Low DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=sg.ViewDistanceQuality=0
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=0
+CVars=sg.EffectsQuality=0
+CVars=sg.TextureQuality=1
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.MaxResolution=512
+CVars=r.DepthOfFieldQuality=0
+CVars=r.BloomQuality=1
+CVars=r.LensFlareQuality=0
+CVars=r.SceneColorFringeQuality=0
+CVars=r.Tonemapper.Quality=2

[Android_Mid DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=1
+CVars=sg.EffectsQuality=1
+CVars=sg.TextureQuality=2
+CVars=r.MobileContentScaleFactor=1.25
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.MaxResolution=1024
+CVars=r.DepthOfFieldQuality=1
+CVars=r.BloomQuality=2
+CVars=r.LensFlareQuality=0
+CVars=r.SceneColorFringeQuality=1
+CVars=r.Tonemapper.Quality=4

; 1080p rather than 1440p: on a phone-sized screen TAA at 1080p is sharp, and the GPU time goes to lighting.
