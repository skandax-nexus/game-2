[/Script/EngineSettings.GameMapsSettings]
; The whole of Hollow Bay is built from code at runtime, so the game boots into the engine's empty
; Entry map. Any map you create later also works: InhGameMode is the global default.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Inheritance.InhGameMode

[/Script/Engine.RendererSettings]
; --- Desktop / editor preview: full UE5 lighting ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.VolumetricFog=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=False
; Everything is spawned at runtime, so there is no baked lighting anywhere.
r.AllowStaticLighting=False
; --- Mobile (Android Vulkan / iOS Metal): deferred renderer with many dynamic lights ---
r.Mobile.ShadingPath=1
r.Mobile.AllowDeferredShadingOpenGL=False
r.MobileHDR=True
r.Mobile.AntiAliasing=2
r.Mobile.SupportGPUScene=True
r.Mobile.EnableMovableSpotlightsShadow=True
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.AllowDitheredLODTransition=True
r.Mobile.Forward.EnableLocalLights=1

[/Script/Engine.UserInterfaceSettings]
; Scale UI by the short side of the screen so text stays readable on phones and tablets.
UIScaleRule=ShortestSide
+UIScaleCurve=(EditorCurveData=(Keys=((Time=480,Value=0.444),(Time=720,Value=0.666),(Time=1080,Value=1.0),(Time=8640,Value=8.0))))

