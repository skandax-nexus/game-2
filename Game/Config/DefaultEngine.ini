[/Script/EngineSettings.GameMapsSettings]
; The whole of Hollow Bay is built from code at runtime, so the game boots into the engine's empty
; Entry map. Any map you create later also works: InhGameMode is the global default.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Inheritance.InhGameMode

[/Script/Engine.RendererSettings]
; ===== Desktop and editor: full UE5 lighting. Phones ignore this group and use the mobile settings below. =====
; Lumen global illumination and reflections: dawn light bounces off floorboards and plaster, the sea mirrors the sky.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Lumen software ray tracing against mesh distance fields runs on any SM6 GPU and needs the distance fields.
; For hardware ray tracing on capable PCs set r.RayTracing=True, r.Lumen.HardwareRayTracing=True and
; r.SkinCache.CompileShaders=True (all three are project settings and need an editor restart).
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
; Virtual shadow maps: crisp, stable shadows from the window light, the lamps and the lighthouse at any distance.
r.Shadow.Virtual.Enable=1
; Temporal Super Resolution: the cleanest edges for thin details such as rigging, window bars and rain streaks.
r.AntiAliasingMethod=4
; Volumetric fog, so the shaft of dawn light and the lighthouse beam are visible in the air.
r.VolumetricFog=1
; Filmic tonemapper at full quality (contrast, vignette, grain). Weaker phones lower it in DefaultDeviceProfiles.ini.
r.Tonemapper.Quality=5
; Depth of field and bokeh quality per desktop tier live in DefaultScalability.ini; phones in DefaultDeviceProfiles.ini.

; ===== Default post-process features, used wherever a post-process volume leaves them unset. =====
; Bloom and lens flares around lamps, lit windows and the lighthouse lens.
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=True
; No motion blur: slow cinematic camera moves read sharper without it.
r.DefaultFeature.MotionBlur=False
; Ambient occlusion grounds the furniture; there is no baked lighting for a static fraction to scale.
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False
; Histogram auto-exposure over the extended (EV100) range, so a candle-lit night and the sunrise both expose well.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Everything is spawned at runtime, so there is no baked lighting anywhere.
r.AllowStaticLighting=False

; ===== Mobile (Android Vulkan / iOS Metal). Per device class tuning lives in DefaultDeviceProfiles.ini. =====
; Deferred shading: many dynamic lights (lamps, candles, lanterns, the lighthouse) at a flat cost per pixel.
; OpenGL ES devices fall back to the forward renderer, so forward local lights stay enabled for them.
r.Mobile.ShadingPath=1
r.Mobile.AllowDeferredShadingOpenGL=False
r.Mobile.Forward.EnableLocalLights=1
; HDR scene colour: required for bloom, depth of field, auto-exposure and the filmic tonemapper on phones.
r.MobileHDR=True
; Temporal anti-aliasing: stable edges on small, dense screens. MSAA is not available with deferred shading.
r.Mobile.AntiAliasing=2
r.Mobile.SupportGPUScene=True
r.Mobile.AllowDitheredLODTransition=True
; Dynamic shadows: only the moon and the sun cast them, as cascaded shadow maps. The lighthouse beam (the one spot
; light) casts none, so the movable-spotlight shadow permutations are left out of the mobile shaders; turn this on
; only together with Beam->SetCastShadows(true) in InhHarbourBuilder. Cascade resolution (1024-2048) and count are
; set per device class in DefaultDeviceProfiles.ini, where they override the scalability tiers instead of fighting them.
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableSpotlightsShadow=False
r.Shadow.CSM.MaxMobileCascades=2

[/Script/Engine.UserInterfaceSettings]
; Scale UI by the short side of the screen so text stays readable on phones and tablets.
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=480,Value=0.444),(Time=720,Value=0.666),(Time=1080,Value=1.0),(Time=8640,Value=8.0))))

