; Desktop and editor quality tiers, on top of the engine's BaseScalability.ini. Phones are tuned in
; DefaultDeviceProfiles.ini. Only r.DOF.* is changed here, and it only drives the desktop (diaphragm) depth of
; field, so none of this costs anything on mobile.

; Epic (the editor's default): real bokeh. The cine camera shoots at f/1.8 to f/4, so out-of-focus lamps,
; lit windows and the lighthouse should bloom into round discs rather than smears.
[PostProcessQuality@3]
r.DOF.Gather.AccumulatorQuality=1
r.DOF.Gather.EnableBokehSettings=1
r.DOF.Gather.RingCount=5
r.DOF.Scatter.EnableBokehSettings=1
r.DOF.Recombine.Quality=2
r.DOF.Recombine.EnableBokehSettings=1
